name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname '*.zip' | head -n1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Nie znaleziono żadnego pliku .zip w repo!"
            ls -la
            exit 1
          fi
          echo "Rozpakowuję: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(dirname "$(find extracted -maxdepth 4 \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | head -n1)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Nie znaleziono build.gradle w rozpakowanym archiwum!"
            find extracted -maxdepth 4
            exit 1
          fi
          echo "Znaleziono projekt w: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: nyxel-client
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
