name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        run: |
          rm -rf proj tmp
          mkdir -p tmp proj/src/main/java proj/src/main/resources
          unzip -o -q nyxel-client-src.zip -d tmp
          cp -r tmp/dev proj/src/main/java/
          cp -r tmp/assets proj/src/main/resources/
          cp tmp/fabric.mod.json tmp/nyxel.mixins.json proj/src/main/resources/

          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'nyxel'
          EOF

          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.configuration-cache=false
          EOF

          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
          }

          version = '1.0.0'
          group = 'dev.nyxel'
          base { archivesName = 'nyxel' }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:1.21.11"
              mappings "net.fabricmc:intermediary:1.21.11:v2"
              modImplementation "net.fabricmc:fabric-loader:0.18.4"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11"
          }

          tasks.withType(JavaCompile).configureEach {
              options.release = 21
              options.encoding = 'UTF-8'
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }
          EOF

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        working-directory: proj
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: nyxel-client
          path: |
            proj/build/libs/*.jar
            !proj/build/libs/*-sources.jar
