name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o -q nyxel-client-src.zip

      - name: Find project dir
        id: proj
        run: |
          GRADLEW=$(find . -name gradlew -not -path './.git/*' | head -n 1)
          DIR=$(dirname "$GRADLEW")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ steps.proj.outputs.dir }}

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: nyxel-client
          path: ${{ steps.proj.outputs.dir }}/build/libs/*.jar
